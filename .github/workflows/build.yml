name: Build Calculator APK

on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      # Fix for "I have to uninstall the old APK before installing the
      # new one". GitHub Actions gives us a brand-new, empty machine every
      # single run. Without this cache, Android's build tools generate a
      # random new debug signing key on every build, so every APK ends up
      # signed differently - and Android refuses to install an app over a
      # previous version signed with a different key. Caching this one
      # file means every build after the first reuses the SAME signing
      # key, so future APKs install as a normal update, no uninstall
      # needed.
      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # Diagnostic - proves whether the cache actually restored a
      # keystore from a previous run, or whether this run is starting
      # fresh. Compare this output between two consecutive builds: if the
      # SHA256 is identical both times, the signing key truly is stable
      # and something else is causing the "must uninstall" problem. If it
      # differs between builds, the cache isn't actually being reused.
      - name: Check debug keystore status (before build)
        run: |
          if [ -f ~/.android/debug.keystore ]; then
            echo "Keystore already exists (cache HIT or reused from earlier in this run)."
            sha256sum ~/.android/debug.keystore
          else
            echo "No keystore yet - this run will create a brand-new one (expected on the very first run after adding this cache step)."
          fi

      - name: Build APK
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        run: |
          yes | buildozer android debug

      - name: Check debug keystore status (after build)
        run: |
          if [ -f ~/.android/debug.keystore ]; then
            echo "Keystore after build:"
            sha256sum ~/.android/debug.keystore
          else
            echo "WARNING: no keystore found at ~/.android/debug.keystore after the build. This means the build is signing with a keystore somewhere else, and caching this path won't help - if you see this, paste this whole log back so the fix can be aimed at the right file."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mathematical-Calculator-APK
          path: bin/*.apk
      - name: Get short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.vars.outputs.sha_short }}
          name: "Calculator build ${{ steps.vars.outputs.sha_short }}"
          files: bin/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
